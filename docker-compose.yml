services:
  postgres-product:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blinka
      POSTGRES_PASSWORD: blinka
      POSTGRES_DB: blinka_product
    ports: ["5432:5432"]
    volumes: [product-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blinka -d blinka_product"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  postgres-agent:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: blinka
      POSTGRES_PASSWORD: blinka
      POSTGRES_DB: blinka_agent
    ports: ["5434:5432"]
    volumes: [agent-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blinka -d blinka_agent"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      BLINKA_PRODUCT_DATABASE_URL: postgresql://blinka:blinka@postgres-product:5432/blinka_product
      BLINKA_AGENT_DATABASE_URL: postgresql://blinka:blinka@postgres-agent:5432/blinka_agent
    ports: ["8000:8000"]
    depends_on:
      postgres-product: {condition: service_healthy}
      postgres-agent: {condition: service_healthy}
    restart: unless-stopped

volumes:
  product-data: {}
  agent-data: {}
