[alembic]
script_location = alembic
prepend_sys_path = .

[product]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://blinka:blinka@localhost:5432/blinka_product
version_table = alembic_version_product
version_locations = %(here)s/alembic/versions/product

[agent]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://blinka:blinka@localhost:5434/blinka_agent
version_table = alembic_version_agent
version_locations = %(here)s/alembic/versions/agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
